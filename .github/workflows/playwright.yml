name: Playwright Tests

# Sharded workflow for parallel test execution
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  # Schedule: Run daily at 6 AM UTC
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers - saves 30-60 seconds per run
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_TESTOPS_RUN_ID: 1
          QASE_TESTOPS_RUN_COMPLETE: false

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1

      - name: Upload test results (traces, videos, screenshots)
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

  publish-qase:
    name: Publish results to Qase
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: qase
      url: https://app.qase.io/run/QADEMO/dashboard/1

    steps:
      - name: Publish results to Qase
        run: |
          {
            echo "### Qase report"
            echo "Playwright results from this workflow were added to the existing Qase run."
            echo ""
            echo "[Open QADemo Automation run](https://app.qase.io/run/QADEMO/dashboard/1)"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-reports:
    name: Merge Playwright Reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Deploy to GitHub Pages.
  # upload-pages-artifact@v5 `name` and deploy-pages@v5 `artifact_name` must match.
  # deploy-pages lists artifacts once and fails the step when that name is missing
  # or appears more than once. A name unique to this run attempt keeps a
  # "Re-run failed jobs" upload from colliding with the artifact left by the
  # earlier attempt. The first deploy is allowed to fail so a transient
  # artifact-list miss can be retried; the retry is not, so a real failure
  # still fails the job.
  deploy-report:
    name: Deploy Report to GitHub Pages
    needs: merge-reports
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Download Playwright Report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait before retrying Pages deployment
        if: ${{ steps.deployment.outcome == 'failure' && !cancelled() }}
        run: |
          echo "deploy-pages failed. Waiting 30 seconds before one retry."
          sleep 30

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: ${{ steps.deployment.outcome == 'failure' && !cancelled() }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Record deployed Pages URL
        id: pages
        if: ${{ (steps.deployment.outcome == 'success' || steps.deployment-retry.outcome == 'success') && !cancelled() }}
        env:
          FIRST_OUTCOME: ${{ steps.deployment.outcome }}
          FIRST_URL: ${{ steps.deployment.outputs.page_url }}
          RETRY_URL: ${{ steps.deployment-retry.outputs.page_url }}
        run: |
          if [ "$FIRST_OUTCOME" = "success" ]; then
            url="$FIRST_URL"
          else
            url="$RETRY_URL"
          fi
          {
            echo "page_url<<EOF"
            echo "$url"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "GitHub Pages URL: ${url}"
